# Same settings as the default configuration created by the shared markdown link check workflow,
# except that links to Swift Package Index are not checked: it occasionally returns 503 (Service Unavailable)
# for documentation pages that exist, which made the check fail on random links.
dirs:
  - .
useGitIgnore: true
ignorePatterns:
  - pattern: '^doc:.*$'
  - pattern: '^http://localhost.*$'
  - pattern: '^https://swiftpackageindex\.com/.*$'
replacementPatterns:
  - pattern: '(.*)#gh-dark-mode-only'
    replacement: '$1'
  - pattern: '(.*)#gh-light-mode-only'
    replacement: '$1'
